<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đăng Nhập - Extra English</title>
  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo-badge {
      width: 56px;
      height: 56px;
      background-color: #eff6ff;
      color: #2563eb;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 700;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
    }
    p.desc {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 28px;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
      min-height: 44px;
    }
    #status-box {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      line-height: 1.5;
      word-break: break-word;
    }
    .status-loading {
      background-color: #eff6ff;
      color: #1d4ed8;
      display: block !important;
    }
    .status-success {
      background-color: #f0fdf4;
      color: #15803d;
      display: block !important;
    }
    .status-error {
      background-color: #fef2f2;
      color: #b91c1c;
      display: block !important;
    }
    .user-profile {
      display: none;
      margin-top: 20px;
      text-align: center;
    }
    .user-profile img {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .user-profile h4 {
      color: #1e293b;
      font-size: 1.1rem;
    }
    .user-profile p {
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="logo-badge">E</div>
    <h2>Đăng Nhập</h2>
    <p class="desc">Vui lòng đăng nhập bằng tài khoản Google để tiếp tục</p>

    <!-- Google Button -->
    <div id="signin-controls">
      <div id="g_id_onload"
           data-client_id="364119049323-rjhas2q5beglrkebe56ml61sbv63thli.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="btn-container">
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="sign_in_with"
             data-shape="rectangular"
             data-logo_alignment="left">
        </div>
      </div>
    </div>

    <!-- Thông tin sau khi đăng nhập thành công -->
    <div id="user-info" class="user-profile">
      <img id="user-avatar" src="" alt="Avatar">
      <h4 id="user-name"></h4>
      <p id="user-email"></p>
    </div>

    <!-- Trạng thái xử lý -->
    <div id="status-box"></div>
  </div>

  <script>
    // Link Apps Script
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyXaRJ1nOiF6RKc1z_j3sJMruAsMqhI99sHcEaG1FPN6MPywJYqzejUDhbCznPBBdbP/exec";

    // Hàm giải mã JWT Token từ Google
    function decodeJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        console.error("Lỗi giải mã Token:", e);
        return null;
      }
    }

    // Xử lý sau khi người dùng chọn tài khoản Google
    async function handleCredentialResponse(response) {
      const statusBox = document.getElementById("status-box");
      const signinControls = document.getElementById("signin-controls");
      const userInfo = document.getElementById("user-info");
      const userAvatar = document.getElementById("user-avatar");
      const userName = document.getElementById("user-name");
      const userEmail = document.getElementById("user-email");

      statusBox.className = "status-loading";
      statusBox.innerText = "Đang xác thực và ghi nhận dữ liệu...";

      const payload = decodeJwt(response.credential);

      if (!payload) {
        statusBox.className = "status-error";
        statusBox.innerText = "Lỗi xác thực danh tính.";
        return;
      }

      // Ẩn nút đăng nhập, hiển thị thông tin tạm
      signinControls.style.display = "none";
      userAvatar.src = payload.picture || "";
      userName.innerText = payload.name || "Người dùng";
      userEmail.innerText = payload.email || "";
      userInfo.style.display = "block";

      const payloadToSend = {
        name: payload.name || "",
        email: payload.email || "",
        sub: payload.sub || ""
      };

      try {
        // Gửi thông tin sang Google Sheet qua Google Apps Script
        await fetch(GAS_WEBAPP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payloadToSend)
        });

        statusBox.className = "status-success";
        statusBox.innerText = "Đăng nhập thành công! Đã lưu nhật ký vào Google Sheets.";
      } catch (err) {
        console.error("Lỗi gửi dữ liệu:", err);
        statusBox.className = "status-error";
        statusBox.innerText = "Đăng nhập được nhưng gặp lỗi khi lưu vào Google Sheets.";
      }
    }
  </script>
</body>
</html>
